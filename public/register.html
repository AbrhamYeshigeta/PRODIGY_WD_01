<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create account · Secure Auth</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="card">
    <h1>Create account</h1>
    <p class="sub">Min 8 chars, 1 uppercase, 1 lowercase, 1 number</p>

    <form id="register-form">
      <label>Username
        <input type="text" name="username" required minlength="3" autocomplete="username" />
      </label>
      <label>Email
        <input type="email" name="email" required autocomplete="email" />
      </label>
      <label>Password
        <input type="password" name="password" required autocomplete="new-password" />
      </label>
      <button type="submit">Sign up</button>
    </form>

    <p id="msg" class="msg"></p>
    <p class="muted">Already registered? <a href="/index.html">Sign in</a></p>
  </main>
  <script type="module" src="/js/register.js"></script>
</body>
</html>
