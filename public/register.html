
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create account · Secure Auth</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="card">
    <h1>Create your account</h1>
    <p class="sub">Join us in less than a minute — all you need is an email.</p>

    <form id="register-form" novalidate>
      <label>Username
        <input type="text" name="username" required minlength="3" autocomplete="username" placeholder=" abrham" />
      </label>

      <label>Email
        <input type="email" name="email" required autocomplete="email" placeholder="you@example.com" />
      </label>
      <!-- Live password requirements -->
      <div class="pw-field">
        <label for="password">Password</label>
        <input
          type="password"
          name="password"
          id="password"
          required
          autocomplete="new-password"
          placeholder="Create a strong password"
        />

        <p class="pw-hint" id="pw-hint" aria-live="polite">
          <span data-rule="length">8+ characters</span>
          <span data-rule="upper">an uppercase letter</span>
          <span data-rule="lower">a lowercase letter</span>
          <span data-rule="number">a number</span>
        </p>
      </div>

      <button type="submit" id="submit-btn">Create account</button>
    </form>

    <p id="msg" class="msg" role="status"></p>
    <p class="muted">Already have an account? <a href="/index.html">Sign in</a></p>
  </main>
  <script type="module" src="/js/register.js"></script>
</body>
</html>
